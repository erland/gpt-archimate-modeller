schema_version: 1
registry_id: archimate-yaml-ea-gpt-distributions
builder_contract:
  target_version: 1.5.0
  normalized_contract: runtime/gpt-builder-1.5-contract.yaml
  runtime_selection: active_targets
  version_source:
    development: VERSION
    release: github_release_tag
  artifact_policy: exact_active_target_set

active_targets:
  - chat_zip
  - custom_gpt
  - claude_projects
  - opencode

inactive_targets:
  openai_plugin:
    compatibility: reduced
    status: not_active
    reason: "Full parity saknas för filesystem write, code execution, persistent workspace, archive I/O och deterministisk mutation/validation."

unified_builder:
  command:
    - "{python}"
    - scripts/build_distributions.py
    - --version
    - "{version}"
    - --output-dir
    - "{output_dir}"

unified_validator:
  command:
    - "{python}"
    - scripts/validate_distributions.py
    - --version
    - "{version}"
    - --dist-dir
    - "{output_dir}"

targets:
  chat_zip:
    status: active
    adapter_id: chat_zip
    artifact_pattern: archimate-yaml-ea-gpt-chat-v{version}.zip
    compatibility: equivalent
    instruction_entrypoint: gpt/SYSTEM_INSTRUCTION.md
  custom_gpt:
    status: active
    adapter_id: custom_gpt
    artifact_pattern: archimate-yaml-ea-gpt-custom-gpt-v{version}.zip
    compatibility: equivalent_with_platform_constraints
    instruction_entrypoint: instructions.txt
  claude_projects:
    status: active
    adapter_id: claude_projects
    artifact_pattern: archimate-yaml-ea-gpt-claude-projects-v{version}.zip
    compatibility: reduced
    instruction_entrypoint: project-instructions.md
  opencode:
    status: active
    adapter_id: opencode
    artifact_pattern: archimate-yaml-ea-gpt-opencode-v{version}.zip
    compatibility: equivalent
    instruction_entrypoint: AGENTS.md

release:
  include_metadata:
    - distribution-build-manifest.json
    - SHA256SUMS.txt
    - release-metadata.yaml
  runtime_assets_from: active_targets
  wildcard_runtime_selection: false

hygiene:
  generated_roots:
    - dist
    - dist-ci
    - release-artifacts
    - build
  forbidden_runtime_projection_paths:
    - AGENTS.md
    - opencode.json
    - .opencode
    - project-instructions.md
    - compatibility.md
  allowed_canonical_runtime_paths:
    - runtime/runtime-contract.json
    - runtime/archimate-tool-contract.json
    - runtime/gpt-builder-1.5-contract.yaml

query:
  id: capability-realization
  title: Arkitekturobjekt som realiserar eller stödjer capabilities
  select: elements
  where:
    type: Capability
  traverse:
    direction: incoming
    relationship_types:
    - Realization
    - Serving
    - Assignment
    - Association
    target_types:
    - ApplicationComponent
    - TechnologyService
    - Node
    - SystemSoftware
    - BusinessProcess
    depth: 1
    include_start: false
  return:
    fields:
    - id
    - type
    - name
    - specialization

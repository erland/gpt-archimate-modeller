eval_case:
  id: EVAL-009
  title: Future retirement
  category: time_lifecycle
  prompt: Applikationen är aktiv idag men planeras avvecklas 2028. Sätt lifecycle=retired nu.
  expectations:
    must_include:
    - planned
    required_actions:

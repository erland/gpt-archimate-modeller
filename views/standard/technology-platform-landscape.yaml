view:
  id: technology-platform-landscape
  title: Teknik- och plattformslandskap
  description: Technology/physical med särskild plattformsgrupp.
  source:
    query: queries/technology-physical-elements.yaml
  include_relationships: between_selected
  layout:
    direction: left_to_right
    algorithm: layered
  groups:
  - id: platforms
    title: Plattformar
    match:
      specializations:
      - Platform
  - id: nodes
    title: Noder & system
    match:
      types:
      - Node
      - Device
      - SystemSoftware
  - id: network
    title: Kommunikation
    match:
      types:
      - Path
      - CommunicationNetwork
      - TechnologyInterface
  - id: behavior
    title: Teknikbeteende & tjänster
    match:
      types:
      - TechnologyFunction
      - TechnologyProcess
      - TechnologyInteraction
      - TechnologyEvent
      - TechnologyService
  - id: physical
    title: Physical
    match:
      types:
      - Equipment
      - Facility
      - DistributionNetwork
      - Material
  - id: artifacts
    title: Artefakter
    match:
      types:
      - Artifact
  nodes:
    label:
      primary: name
      secondary:
      - type
      - specialization
    show_properties:
    - owner
    - lifecycle
    - criticality
  edges:
    show_type: true
    show_name: false
    show_confidence: false

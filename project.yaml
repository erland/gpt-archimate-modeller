scope:
  current: Step 44 - End-to-end GPT test
  next: Step 45 - Real EA pilot

runtime_migration:
  framework: gpt-builder-1.4.0
  track_status: in_progress
  product_plan_status_preserved: true
  last_completed_step: 56
  next_step: 57
  assessment: docs/gpt-builder-1.4-runtime-migration.md
  runtime_contract: runtime/runtime-contract.json
  tool_contract: runtime/archimate-tool-contract.json
  distribution_registry: runtime/distribution-registry.yaml
  parity_contract: evals/runtime-parity-contract.yaml
  contract_schemas:
  - schemas/runtime-behavior-contract.schema.json
  - schemas/runtime-capability-contract.schema.json
  - schemas/runtime-artifact-contract.schema.json
  - schemas/runtime-workspace-state-contract.schema.json
  - schemas/runtime-tool-contract.schema.json
  active_runtime_targets:
  - chat_zip
  - custom_gpt
  - claude_projects
  - opencode
  assessed_not_planned:
  - openai_plugin
  parity_dimensions:
  - behavior
  - capability
  - artifact
  - workspace_state
  - tool

distributions:
  claude_projects:
    status: implemented
    compatibility: reduced
    artifact_pattern: archimate-yaml-ea-gpt-claude-projects-v<version>.zip
    instructions: project-instructions.md
    compatibility_document: compatibility.md
    runtime_contract_snapshot: runtime-contract.json
    tool_contract_snapshot: archimate-tool-contract.json
    executable_scripts_packaged: false
  opencode:
    status: implemented
    compatibility: equivalent
    artifact_pattern: archimate-yaml-ea-gpt-opencode-v<version>.zip
    instructions: AGENTS.md
    config: opencode.json
    runtime_contract_snapshot: .opencode/runtime-contract.json
    tool_mapping: .opencode/tool-mapping.json
    typed_tools: .opencode/tools/archimate.ts
    project_root_argument: projectRoot
    direct_shell_for_canonical_mutation: false

build:
  registry_driven: true
  registry: runtime/distribution-registry.yaml
  all_distributions_builder: scripts/build_all_distributions.py
  all_distributions_validator: scripts/validate_all_distributions.py
  hygiene_validator: scripts/scan_repository_hygiene.py

evals_runtime_parity:
  instruction_adherence_runner: scripts/run_runtime_instruction_adherence.py
  parity_validator: scripts/validate_runtime_parity.py
  dimensions:
  - behavior
  - capability
  - artifact
  - workspace_state
  - tool
  runtimes:
  - chat_zip
  - custom_gpt
  - claude_projects
  - opencode

release:
  workflow: .github/workflows/release.yml
  builder: scripts/build_release.sh
  validator: scripts/validate_release_workflow.py
  version_source: git_tag
  runtime_count: 4
  registry_driven: true
  artifacts:
  - archimate-yaml-ea-gpt-chat-v<version>.zip
  - archimate-yaml-ea-gpt-custom-gpt-v<version>.zip
  - archimate-yaml-ea-gpt-claude-projects-v<version>.zip
  - archimate-yaml-ea-gpt-opencode-v<version>.zip
  - distribution-build-manifest.json
  - SHA256SUMS.txt
  - release-metadata.yaml

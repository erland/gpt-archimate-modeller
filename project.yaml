distributions:
  claude_projects:
    status: implemented
    compatibility: reduced
    artifact_pattern: archimate-yaml-ea-gpt-claude-projects-v<version>.zip
    instructions: project-instructions.md
    compatibility_document: compatibility.md
    runtime_contract_snapshot: runtime-contract.json
    tool_contract_snapshot: archimate-tool-contract.json
    executable_scripts_packaged: false
  opencode:
    status: implemented
    compatibility: equivalent
    artifact_pattern: archimate-yaml-ea-gpt-opencode-v<version>.zip
    instructions: AGENTS.md
    config: opencode.json
    runtime_contract_snapshot: .opencode/runtime-contract.json
    tool_mapping: .opencode/tool-mapping.json
    typed_tools: .opencode/tools/archimate.ts
    project_root_argument: projectRoot
    direct_shell_for_canonical_mutation: false

build:
  registry_driven: true
  registry: runtime/distribution-registry.yaml
  all_distributions_builder: scripts/build_all_distributions.py
  all_distributions_validator: scripts/validate_all_distributions.py
  hygiene_validator: scripts/scan_repository_hygiene.py

evals_runtime_parity:
  instruction_adherence_runner: scripts/run_runtime_instruction_adherence.py
  parity_validator: scripts/validate_runtime_parity.py
  dimensions:
  - behavior
  - capability
  - artifact
  - workspace_state
  - tool
  runtimes:
  - chat_zip
  - custom_gpt
  - claude_projects
  - opencode

release:
  workflow: .github/workflows/release.yml
  builder: scripts/build_release.sh
  validator: scripts/validate_release_workflow.py
  version_source: git_tag
  runtime_count: 4
  registry_driven: true
  artifacts:
  - archimate-yaml-ea-gpt-chat-v<version>.zip
  - archimate-yaml-ea-gpt-custom-gpt-v<version>.zip
  - archimate-yaml-ea-gpt-claude-projects-v<version>.zip
  - archimate-yaml-ea-gpt-opencode-v<version>.zip
  - distribution-build-manifest.json
  - SHA256SUMS.txt
  - release-metadata.yaml

release_readiness:
  version: 1.0.0
  migration_track_complete: true
  product_plan_preserved: true
  product_plan_completed: 48
  product_plan_total: 48
  full_regression_required: true
  four_runtime_parity_required: true

pilot:
  step: 45
  report: docs/real-ea-pilot-step45.md
  source_artifact: it-formagemodell-standard-archimate-v1.11.0.zip
  source_artifact_committed: false
  executed_with_runtime: 1.0.0-rc.5
  result: completed_with_findings
  step46_inputs:
  - files.impact_themes is not represented in the current project schema
  - portable exact relationship-pair coverage is too narrow for the pilot model
  - standard capability-realization report does not represent TechnologyService/Association-based realization semantics
  - quality scoring is dominated by missing owner/source metadata in imported real-world models

format_revision:
  step: 46
  report: docs/format-revision-step46.md
  target_format_version: '0.2'
  package_layout_version: '0.1'
  reads_legacy_format_versions: ['0.1', '0.2']
  migration_required_for_write_upgrade: true
  changes:
  - controlled optional impact theme registry
  - aggregated uncovered relationship-pair findings
  - normalized quality dimensions
  - broader capability realization report semantics
  - bounded query CLI/tool output with truncation metadata

compatibility:
  step: 47
  target_format_version: '0.2'
  readable_format_versions:
  - '0.1'
  - '0.2'
  explicit_migration:
    from: '0.1'
    to: '0.2'
    id: MIG-000002
  preserves_existing_impact_themes: true
  creates_empty_registry_when_missing: true
  invalidates_derived_manifest_and_index_before_repack: true
  migration_history_required: true
  downgrade_supported: false

final_release:
  step: 48
  version: 1.0.0
  tag: v1.0.0
  product_plan_complete: true
  target_project_format: '0.2'
  backward_compatibility:
    readable: ['0.1', '0.2']
    migration: MIG-000002
  runtime_distributions:
  - chat_zip
  - custom_gpt
  - claude_projects
  - opencode
  publish_after_merge: true

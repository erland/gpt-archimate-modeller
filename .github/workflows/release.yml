name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing GitHub Release tag, for example v1.0.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${{ inputs.tag }}"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid SemVer release tag: $TAG" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout released tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Build and validate release artifacts
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: bash scripts/build_release.sh

      - name: Validate exact release asset set
        run: python scripts/validate_release_assets_1_5.py --version "${{ steps.tag.outputs.version }}" --dir release-artifacts

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: archimate-yaml-ea-gpt-${{ steps.tag.outputs.tag }}
          path: |
            release-artifacts/*.zip
            release-artifacts/distribution-build-manifest.json
            release-artifacts/SHA256SUMS.txt
            release-artifacts/release-metadata.yaml
          if-no-files-found: error
          retention-days: 14

      - name: Attach artifacts to existing GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        shell: bash
        run: |
          gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null
          mapfile -t assets < <(python scripts/validate_release_assets_1_5.py             --version "${{ steps.tag.outputs.version }}"             --dir release-artifacts             --print-paths)
          gh release upload "$TAG" "${assets[@]}" --clobber --repo "${{ github.repository }}"

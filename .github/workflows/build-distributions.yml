name: Build GPT distributions

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    outputs:
      version: ${{ steps.version.outputs.version }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Resolve development build version
        id: version
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Test before packaging
        run: python scripts/run_tests.py --format text
      - name: Build registry distributions
        run: python scripts/build_all_distributions.py --version "${{ steps.version.outputs.version }}" --output-dir dist
      - name: Validate registry distributions
        run: python scripts/validate_all_distributions.py --manifest dist/distribution-build-manifest.json
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: archimate-yaml-ea-gpt-v${{ steps.version.outputs.version }}
          path: |
            dist/*.zip
            dist/distribution-build-manifest.json
          if-no-files-found: error
          retention-days: 14

name: Build GPT distributions

on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    outputs:
      version: ${{ steps.version.outputs.version }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            TAG='${{ github.event.release.tag_name }}'
            if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
              echo "Invalid release tag: $TAG (expected v<semver>)" >&2
              exit 1
            fi
            VERSION="${TAG#v}"
          else
            VERSION="$(tr -d '[:space:]' < VERSION)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Test before packaging
        run: python scripts/run_tests.py --format text
      - name: Build registry distributions
        run: python scripts/build_all_distributions.py --version "${{ steps.version.outputs.version }}" --output-dir dist
      - name: Validate registry distributions
        run: python scripts/validate_all_distributions.py --manifest dist/distribution-build-manifest.json
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: archimate-yaml-ea-gpt-v${{ steps.version.outputs.version }}
          path: |
            dist/*.zip
            dist/distribution-build-manifest.json
          if-no-files-found: error
          retention-days: 14

  release-assets:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: archimate-yaml-ea-gpt-v${{ needs.build.outputs.version }}
          path: dist
      - name: Attach runtime distributions to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.zip dist/distribution-build-manifest.json --clobber --repo "${{ github.repository }}"

name: Build GPT distributions

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    outputs:
      version: ${{ steps.version.outputs.version }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Resolve development build version
        id: version
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Test before packaging
        run: python scripts/run_tests.py --format text
      - name: Download pinned GPT Byggaren engine
        shell: bash
        run: |
          set -euo pipefail
          curl -fLSs --retry 3 \
            'https://github.com/erland/gpt-byggaren/releases/download/v1.6.33/gpt-byggaren-engine-1.6.33.zip' \
            -o /tmp/gpt-byggaren-engine-1.6.33.zip
          python - <<'PY'
          import zipfile
          from pathlib import Path
          src=Path('/tmp/gpt-byggaren-engine-1.6.33.zip')
          root=Path('/tmp/gpt-byggaren-engine-1.6.33')
          with zipfile.ZipFile(src) as archive:
              for item in archive.infolist():
                  p=Path(item.filename)
                  if p.is_absolute() or '..' in p.parts or item.is_dir() and item.filename.startswith('/'):
                      raise SystemExit(f'Unsafe engine archive entry: {item.filename}')
              archive.extractall(root)
          print('Extracted pinned engine',src.name)
          PY
      - name: Build and verify canonical 1.6.33 distributions
        run: bash scripts/build_distributions_1_6_33.sh "${{ steps.version.outputs.version }}"
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: archimate-yaml-ea-gpt-1.6.33-v${{ steps.version.outputs.version }}
          path: |
            dist/*.zip
            dist/DELIVERY-MANIFEST.json
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

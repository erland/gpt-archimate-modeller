name: GPT Byggaren 1.6.33 migration validation

on:
  pull_request:
    paths:
      - 'gpt-project.yaml'
      - 'canonical/**'
      - 'migration-status-1.6.33.yaml'
      - '.github/workflows/gpt-builder-1.6.33-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python validation dependencies
        run: python -m pip install 'PyYAML>=6,<7' 'jsonschema>=4,<5'
      - name: Download pinned GPT Byggaren engine
        shell: bash
        run: |
          set -euo pipefail
          curl -fLSs --retry 3 \
            'https://github.com/erland/gpt-byggaren/releases/download/v1.6.33/gpt-byggaren-engine-1.6.33.zip' \
            -o /tmp/gpt-byggaren-engine-1.6.33.zip
          python - <<'PY'
          import zipfile
          from pathlib import Path
          src=Path('/tmp/gpt-byggaren-engine-1.6.33.zip')
          root=Path('/tmp/gpt-byggaren-engine-1.6.33')
          with zipfile.ZipFile(src) as archive:
              for item in archive.infolist():
                  p=Path(item.filename)
                  if p.is_absolute() or '..' in p.parts or item.is_dir() and item.filename.startswith('/'):
                      raise SystemExit(f'Unsafe engine archive entry: {item.filename}')
              archive.extractall(root)
          print('Extracted pinned engine',src.name)
          PY
      - name: Original engine selftest
        run: python /tmp/gpt-byggaren-engine-1.6.33/scripts/selftest_distribution_engine.py --source /tmp/gpt-byggaren-engine-1.6.33
      - name: Install pinned engine contract schemas for validation
        shell: bash
        run: |
          set -euo pipefail
          for schema in capability-contract.schema.json skill-contract.schema.json project-status.schema.json; do
            test -f "/tmp/gpt-byggaren-engine-1.6.33/schemas/$schema"
            cp "/tmp/gpt-byggaren-engine-1.6.33/schemas/$schema" "schemas/$schema"
          done
      - name: Original engine project lint
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/gpt-byggaren-engine-1.6.33/scripts/lint_gpt_project.py --project-root . --json | tee /tmp/gpt-builder-1.6.33-lint.json
          python - <<'PY'
          import json
          report=json.load(open('/tmp/gpt-builder-1.6.33-lint.json',encoding='utf-8'))
          if report.get('result') != 'pass' or report.get('summary',{}).get('errors',0):
              raise SystemExit(f"GPT Byggaren project lint failed: {report.get('summary')}")
          PY

name: GPT Byggaren 1.6.33 migration validation

on:
  pull_request:
    paths:
      - 'gpt-project.yaml'
      - 'canonical/**'
      - 'migration-status-1.6.33.yaml'
      - '.github/workflows/gpt-builder-1.6.33-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python validation dependencies
        run: python -m pip install 'PyYAML>=6,<7' 'jsonschema>=4,<5'
      - name: Download pinned GPT Byggaren engine
        shell: bash
        run: |
          set -euo pipefail
          curl -fLSs --retry 3 \
            'https://github.com/erland/gpt-byggaren/releases/download/v1.6.33/gpt-byggaren-engine-1.6.33.zip' \
            -o /tmp/gpt-byggaren-engine-1.6.33.zip
          python - <<'PY'
          import zipfile
          from pathlib import Path
          src=Path('/tmp/gpt-byggaren-engine-1.6.33.zip')
          root=Path('/tmp/gpt-byggaren-engine-1.6.33')
          with zipfile.ZipFile(src) as archive:
              for item in archive.infolist():
                  p=Path(item.filename)
                  if p.is_absolute() or '..' in p.parts or item.is_dir() and item.filename.startswith('/'):
                      raise SystemExit(f'Unsafe engine archive entry: {item.filename}')
              archive.extractall(root)
          print('Extracted pinned engine',src.name)
          PY
      - name: Original engine selftest
        run: python /tmp/gpt-byggaren-engine-1.6.33/scripts/selftest_distribution_engine.py --source /tmp/gpt-byggaren-engine-1.6.33
      - name: Install pinned engine contract schemas for validation
        shell: bash
        run: |
          set -euo pipefail
          for schema in capability-contract.schema.json skill-contract.schema.json project-status.schema.json; do
            test -f "/tmp/gpt-byggaren-engine-1.6.33/schemas/$schema"
            cp "/tmp/gpt-byggaren-engine-1.6.33/schemas/$schema" "schemas/$schema"
          done
      - name: Install pinned engine runtime templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p templates
          for template in START-HERE.chat.md.tpl README.claude.md.tpl README.opencode.md.tpl README.plugin.md.tpl; do
            test -f "/tmp/gpt-byggaren-engine-1.6.33/templates/$template"
            cp "/tmp/gpt-byggaren-engine-1.6.33/templates/$template" "templates/$template"
          done
      - name: Original engine project lint
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/gpt-byggaren-engine-1.6.33/scripts/lint_gpt_project.py --project-root . --json | tee /tmp/gpt-builder-1.6.33-lint.json
          python - <<'PY'
          import json
          report=json.load(open('/tmp/gpt-builder-1.6.33-lint.json',encoding='utf-8'))
          if report.get('result') not in ('pass', 'warning') or report.get('summary',{}).get('errors',0):
              raise SystemExit(f"GPT Byggaren project lint failed: {report.get('summary')}")
          PY

      - name: Build five distributions with original engine
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/gpt-byggaren-engine-1.6.33/scripts/build_distributions.py --project-root . --version 1.0.0-migration
      - name: Validate original engine distributions
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/gpt-byggaren-engine-1.6.33/scripts/validate_distributions.py --project-root .
      - name: Verify transitive Skill Python imports
        run: python scripts/verify_skill_python_closure.py
      - name: Audit non-Python resource candidates
        run: python scripts/audit_skill_data_references.py --output skill-data-references.json
      - name: Upload non-Python resource audit
        uses: actions/upload-artifact@v4
        with:
          name: skill-data-references-1.6.33
          path: skill-data-references.json
          if-no-files-found: error
      - name: Verify scripts within five built runtime archives
        run: python scripts/verify_migration_skill_archives.py
      - name: Upload migration build output
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gpt-byggaren-1.6.33-migration-distributions
          path: dist/*.zip
          if-no-files-found: error

name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Reject committed cache/build junk
        shell: bash
        run: |
          if find . -type d -name __pycache__ -print -quit | grep -q .; then
            echo 'Python __pycache__ must not be committed'; exit 1
          fi
          if find . -type f -name '*.pyc' -print -quit | grep -q .; then
            echo 'Python .pyc files must not be committed'; exit 1
          fi
          test ! -d dist || { echo 'dist/ must not be committed'; exit 1; }
      - name: Run automated regression suite
        run: python scripts/run_tests.py --format text
      - name: Validate supporting contracts
        run: |
          python scripts/validate_llm_evals.py
          python scripts/validate_user_docs.py
          python scripts/validate_developer_docs.py
          python scripts/validate_reference_projects.py
          python scripts/validate_fixture_catalog.py
      - name: Build and validate distributions
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          python scripts/build_distributions.py --version "$VERSION"
          python scripts/validate_distributions.py --version "$VERSION"
